name: claude-audit

# Агент-аудитор. Просыпается на каждую заявку на изменение и проверяет её
# по правилам проекта. Пишет замечания в заявку. Ничего не меняет.
#
# Это независимая пара глаз: аудитор не участвовал в написании изменений.

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Показать изменения заявки
        run: |
          git fetch origin ${{ github.base_ref }} --depth=50
          echo "=== файлы заявки ==="
          git diff --stat origin/${{ github.base_ref }}...HEAD
          echo "=== дифф ==="
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff
          wc -l /tmp/pr.diff

      - name: Конфигурация агентов — аудитор здесь бессилен, честный красный
        run: |
          # Действие claude-code-action не работает на заявках, меняющих
          # .github/workflows/ — и завершается УСПЕХОМ, ничего не проверив.
          # Замерено на заявках #6 и #7: job «audit» = success за 14–16 секунд,
          # при том что настоящий разбор занимает 60–150 секунд (#8, #13).
          # Молчаливый зелёный на файлах, раздающих агенту права, недопустим.
          # Здесь он заменяется явным красным.
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
                    | grep '^\.github/workflows/' || true)
          if [ -n "$CHANGED" ]; then
            echo "Заявка меняет конфигурацию агентов:"
            echo "$CHANGED"
            echo
            echo "Автоматический аудитор этот класс изменений проверить НЕ МОЖЕТ."
            echo "Требуется разбор человеком или архитектором до слияния."
            echo "Красный здесь означает «не проверено», а не «сломано»."
            exit 1
          fi
          echo "Конфигурация агентов не затронута — аудит продолжается."

      - name: Аудит
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Заявки открывает агент-исполнитель, то есть бот. Без этой строки аудитор
          # отказывается работать («non-human actor») и заявка остаётся без проверки.
          # Аудитору это безопасно: он только читает дифф и пишет комментарий,
          # ничего не меняет. В claude.yml (исполнитель) такой строки быть НЕ должно —
          # там защита не даёт агенту будить самого себя.
          allowed_bots: "*"
          claude_args: >-
            --allowed-tools "Bash(gh:*),Bash(git:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Read,Grep,Glob,Write" --max-turns 60
          prompt: |
            Ты — независимый аудитор изменений в проекте Consilium Spine. Ты НЕ писал этот код.
            Твоя задача — найти дефекты до слияния. Ничего не исправляй, только докладывай.

            ГРАНИЦЫ РАБОТЫ — соблюдать строго, они экономят лимит подписки оператора:
            - смотри ТОЛЬКО дифф заявки (`git diff origin/${{ github.base_ref }}...HEAD`),
              он же лежит в /tmp/pr.diff;
            - НЕ читай каталоги CONSILIUM_REPO_v4_2_* целиком, НЕ открывай docs/HANDOFF*
              (7500 строк) и папку Reports/ — они к изменениям заявки отношения не имеют;
            - открывай отдельный файл целиком только если без него нельзя оценить
              конкретную строку диффа, и не более трёх файлов за проход;
            - если дифф тривиален (удаление файла, правка комментария, переименование) —
              напиши это одной строкой и заверши работу, не разворачивая проверку.

            КАК ОПУБЛИКОВАТЬ РЕЗУЛЬТАТ — обязательные последние два действия:
            1) запиши полный разбор в файл /tmp/audit.md;
            2) выполни ровно эту команду:
               gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/audit.md

            Работа без опубликованного комментария считается НЕВЫПОЛНЕННОЙ: разбор, который
            никто не прочитает, равен отсутствию разбора. Если команда вернула ошибку —
            напечатай её текст и весь разбор в лог целиком, это запасная поверхность.

            Проверь заявку по закрытому списку. По каждому пункту дай вердикт
            «в порядке» / «замечание» с конкретной строкой:

            1. ПРОВЕНАНС. Все ли изменённые файлы объяснены описанием заявки? Есть ли файлы,
               появление которых не объяснено? Артефакт неизвестного происхождения
               не принимается, даже если работает.
            2. ПИНЫ. Каждое изменение поведения сопровождается пином? Пин проверяет СВОЙСТВО
               (что охраняется) или ФОРМУ (имя переменной, порядок строк)? Пин на форму
               запрещает правку кода, а не дефект.
            3. НЕГАТИВНЫЙ КОНТРОЛЬ. Есть ли мутация, доказывающая, что пин краснеет?
               Пин без доказательства применимости считается пустым.
            4. ОТКАЗ НЕ РАВЕН ПРОХОДУ. Не появилось ли skipTest, условий вокруг проверок,
               ранних return, из-за которых проверка может тихо не исполниться?
            5. ДОЕЗД. Если добавлено новое поле — читает ли его та поверхность, ради которой
               оно заведено? Класс «произведено, но не опубликовано» в этом проекте
               встречался пять раз.
            6. ЧЕСТНОСТЬ ОТСУТСТВИЯ. Ноль вместо неизвестного, пустая строка вместо
               объявленного отказа, значение по умолчанию вместо измерения — запрещены.
               Отсутствие называется отсутствием и объясняет причину.
            7. БАЗИС ЕДЕТ С ЧИСЛОМ. У каждой публикуемой величины видно, откуда она и в чём
               измерена. Сравнение величин разных базисов запрещено.
            8. РАЗДЕЛЕНИЕ ТРУДА. Арифметику считает код, суждения выносит модель.
               Любое денежное число, которое модель может написать свободно, — дефект.
            9. ДЕТЕРМИНИЗМ ВЕРДИКТА. Изменения не должны позволять справочным (advisory)
               величинам влиять на вердикт, лестницу входа или алерты.
            10. ПОЛНОТА. Если правилу подчиняется несколько поверхностей публикации —
                применено ли исправление ко всем? Исправление одной поверхности из двух
                в этом проекте встречалось трижды.

            В конце дай итог одной строкой: «ПРИНЯТЬ» / «ПРИНЯТЬ С ЗАМЕЧАНИЯМИ» /
            «ВЕРНУТЬ НА ДОРАБОТКУ», с одним предложением обоснования.
            Не смягчай формулировки: пропущенный дефект стоит проекту денег.

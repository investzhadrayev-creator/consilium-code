name: suite

# Гоняет полный сьют и каталог мутаций на САМОМ СВЕЖЕМ дереве версии в репозитории.
# Запускается при каждой заливке и вручную кнопкой Run workflow.
#
# Node и npm install обязательны: без node_modules JS-гейты (в частности test_undef.js)
# молча не стартуют, и раннер честно скажет NOT VERIFIED. Класс известен проекту.

on:
  push:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Найти новейшее дерево версии
        id: tree
        run: |
          # ищем ТОЛЬКО каталоги: рядом лежат .zip-архивы с теми же именами,
          # и фильтр по имени выбрал бы архив вместо дерева
          echo "Кандидаты:"
          find . -maxdepth 1 -type d -name 'CONSILIUM_REPO_v4_2_*' -printf '%f\n' | sort -V
          DIR=$(find . -maxdepth 1 -type d -name 'CONSILIUM_REPO_v4_2_*' -printf '%f\n' | sort -V | tail -1)
          if [ -z "$DIR" ]; then
            echo "Каталог версии не найден — нечего проверять."
            exit 1
          fi
          if [ ! -f "$DIR/run_tests.py" ]; then
            echo "В каталоге $DIR нет run_tests.py — это не дерево версии."
            exit 1
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Проверяем дерево: $DIR"

      - name: Маркер сборки — ровно одна строка
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          N=$(grep -h '__build__ = ' microservice/*.py | sort -u | wc -l)
          grep -h '__build__ = ' microservice/*.py | sort -u
          if [ "$N" -ne 1 ]; then
            echo "Маркеры сборки расходятся: $N разных строк."
            exit 1
          fi

      - name: Python-зависимости
        working-directory: ${{ steps.tree.outputs.dir }}
        run: |
          # requirements.txt живёт в microservice/, не в корне дерева
          python -m pip install --upgrade pip
          if [ -f microservice/requirements.txt ]; then
            pip install -r microservice/requirements.txt
          else
            echo "microservice/requirements.txt не найден — состав окружения неизвестен."
            exit 1
          fi

      - name: npm install
        working-directory: ${{ steps.tree.outputs.dir }}
        run: npm install

      - name: Полный сьют
        working-directory: ${{ steps.tree.outputs.dir }}
        run: python run_tests.py

      - name: Каталог мутаций
        working-directory: ${{ steps.tree.outputs.dir }}
        run: python tools/mutation_probe.py
